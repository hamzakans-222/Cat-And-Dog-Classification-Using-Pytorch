<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat vs Dog Classifier</title>
    <link rel="stylesheet" href="index.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Background blobs -->
    <div class="bg-blob blob-1"></div>
    <div class="bg-blob blob-2"></div>
    <div class="bg-blob blob-3"></div>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="header-icon">
                <span class="icon-cat">🐱</span>
                <span class="icon-vs">vs</span>
                <span class="icon-dog">🐶</span>
            </div>
            <h1>Cat vs Dog <span class="gradient-text">Classifier</span></h1>
            <p class="subtitle">Importez une image et notre IA vous dira s'il s'agit d'un chat ou d'un chien</p>
            <div class="badge">
                <span class="badge-dot"></span>
                Modèle CNN — Précision 91%
            </div>
        </div>

        <!-- Upload Card -->
        <div class="card upload-card" id="uploadCard">
            <input type="file" id="imageInput" accept="image/*" hidden>
            <div class="drop-zone" id="dropZone">
                <div class="drop-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="16 16 12 12 8 16"></polyline>
                        <line x1="12" y1="12" x2="12" y2="21"></line>
                        <path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"></path>
                    </svg>
                </div>
                <p class="drop-text">Glissez-déposez votre image ici</p>
                <p class="drop-subtext">ou</p>
                <label for="imageInput" class="upload-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                    Choisir une image
                </label>
                <p class="drop-hint">PNG, JPG, JPEG — Max 10 MB</p>
            </div>
        </div>

        <!-- Preview & Result -->
        <div class="card preview-card" id="previewCard" style="display: none;">
            <div class="preview-header">
                <span class="preview-title">Image sélectionnée</span>
                <button class="change-btn" id="changeBtn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 .49-3.77"></path></svg>
                    Changer
                </button>
            </div>
            <div class="image-wrapper">
                <img id="imagePreview" src="" alt="Aperçu de l'image">
                <div class="image-overlay" id="imageOverlay" style="display:none;">
                    <div class="spinner"></div>
                </div>
            </div>
            <button id="predictBtn" class="predict-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <span id="btnText">Analyser l'image</span>
            </button>
        </div>

        <!-- Result Card -->
        <div class="card result-card" id="resultCard" style="display: none;">
            <div class="result-icon" id="resultIcon"></div>
            <div class="result-label" id="resultLabel"></div>
            <div class="result-confidence" id="resultConfidence"></div>
            <div class="result-bar-container">
                <div class="result-bar-label">
                    <span>🐱 Chat</span>
                    <span>🐶 Chien</span>
                </div>
                <div class="result-bar-bg">
                    <div class="result-bar-fill" id="resultBar"></div>
                </div>
            </div>
            <button class="retry-btn" id="retryBtn">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 .49-3.77"></path></svg>
                Nouvelle analyse
            </button>
        </div>

        <!-- Footer -->
        <div class="footer">
            <p>Propulsé par un CNN PyTorch • Entraîné sur 25 000 images</p>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
